name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Dummy URLs — generate/build only; no live DB required for CI
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      ADMIN_PASSWORD: ci-admin
      ADMIN_SECRET: ci-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: ESLint (code quality + Core Web Vitals)
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Production build (compile + bundle)
        run: npm run build
